<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水電 & CCTV 工程管理系統 (Firebase Sync)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf.js for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; font-size: 12pt; }
            .page-break { page-break-after: always; }
        }
        .print-only { display: none; }
        /* A4 Page styling for preview */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            padding: 15mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        @media (max-width: 768px) {
            .a4-page {
                width: 100%;
                min-height: auto;
                padding: 10px;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50 no-print">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-faucet-drip text-blue-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">水電 & CCTV 工程管理系統</h1>
                <span class="bg-blue-600 text-xs px-2 py-0.5 rounded text-white font-medium">MYR</span>
            </div>

            <!-- Operational User Switcher & Cloud Status -->
            <div class="flex items-center space-x-4">
                <div id="sync-status" class="flex items-center space-x-1.5 text-xs text-emerald-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="sync-status-text">雲端同步中</span>
                </div>

                <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                    <i class="fa-solid fa-user-gear text-slate-400"></i>
                    <span class="text-xs text-slate-400 hidden sm:inline">目前操作員:</span>
                    <select id="user-selector" onchange="changeCurrentUser(this.value)" class="bg-slate-900 text-white text-sm font-semibold focus:outline-none cursor-pointer border-none py-0">
                        <option value="1) EDWARD">1) EDWARD</option>
                        <option value="2) YIN">2) YIN</option>
                        <option value="3) BACKOFFICE">3) BACKOFFICE</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- App Main Tabs -->
        <div class="bg-slate-800 border-t border-slate-700">
            <div class="max-w-7xl mx-auto px-4 flex space-x-2 overflow-x-auto py-2 text-sm">
                <button onclick="switchTab('dashboard')" id="tab-btn-dashboard" class="tab-btn active px-4 py-2 rounded-lg font-medium transition flex items-center space-x-2 bg-blue-600 text-white">
                    <i class="fa-solid fa-chart-line"></i><span>儀表板 & 概覽</span>
                </button>
                <button onclick="switchTab('documents')" id="tab-btn-documents" class="tab-btn px-4 py-2 rounded-lg font-medium transition text-slate-300 hover:bg-slate-700 flex items-center space-x-2">
                    <i class="fa-solid fa-file-invoice-dollar"></i><span>報價單 / 發票列表</span>
                </button>
                <button onclick="switchTab('create')" id="tab-btn-create" class="tab-btn px-4 py-2 rounded-lg font-medium transition text-slate-300 hover:bg-slate-700 flex items-center space-x-2">
                    <i class="fa-solid fa-circle-plus"></i><span>新建報價單 / 發票</span>
                </button>
                <button onclick="switchTab('customers')" id="tab-btn-customers" class="tab-btn px-4 py-2 rounded-lg font-medium transition text-slate-300 hover:bg-slate-700 flex items-center space-x-2">
                    <i class="fa-solid fa-address-book"></i><span>客戶資料庫</span>
                </button>
                <button onclick="switchTab('company-settings')" id="tab-btn-company-settings" class="tab-btn px-4 py-2 rounded-lg font-medium transition text-slate-300 hover:bg-slate-700 flex items-center space-x-2">
                    <i class="fa-solid fa-building"></i><span>公司資料 & 入賬帳號</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 pt-6">

        <!-- TAB 1: Dashboard -->
        <section id="tab-dashboard" class="tab-content space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs text-slate-500 font-medium uppercase">總單據數</p>
                            <h3 id="stat-total-docs" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                        </div>
                        <div class="p-3 bg-blue-50 text-blue-600 rounded-lg"><i class="fa-solid fa-folder-open text-xl"></i></div>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs text-slate-500 font-medium uppercase">待處理報價單 (QT)</p>
                            <h3 id="stat-total-qt" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
                        </div>
                        <div class="p-3 bg-amber-50 text-amber-600 rounded-lg"><i class="fa-solid fa-file-signature text-xl"></i></div>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs text-slate-500 font-medium uppercase">工程進行中 發票</p>
                            <h3 id="stat-in-progress" class="text-2xl font-bold text-indigo-600 mt-1">0</h3>
                        </div>
                        <div class="p-3 bg-indigo-50 text-indigo-600 rounded-lg"><i class="fa-solid fa-spinner text-xl"></i></div>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs text-slate-500 font-medium uppercase">已完工 / 結案總額 (MYR)</p>
                            <h3 id="stat-total-amount" class="text-2xl font-bold text-emerald-600 mt-1">RM 0.00</h3>
                        </div>
                        <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg"><i class="fa-solid fa-sack-dollar text-xl"></i></div>
                    </div>
                </div>
            </div>

            <!-- Recent Documents Table -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-clock-rotate-left mr-2 text-blue-600"></i>最新建立單據</h2>
                    <button onclick="switchTab('create')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded-lg transition flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> 新開報價單/發票
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-50 text-slate-700 font-semibold border-
